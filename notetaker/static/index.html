<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notetaker — offline Indic meeting notes</title>
<link rel="stylesheet" href="/app.css?v=0.2.0">
</head>
<body class="shell">
<div class="shell-wrap" style="display:contents"><aside class="side">
  <span class="brand"><span class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></span>Notetaker<span class="dot" id="dot" title="server status"></span></span>
  <nav><a href="/" aria-current="page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>Record</a><a href="/app/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Recordings</a></nav>
  <div class="foot" id="foot">Local · offline</div>
</aside><div class="main">
<main class="container">
  <div class="pagehead">
    <h1>Capture the meeting.<br>Keep the notes.</h1>
    <p>Offline Hindi &amp; Indic transcription with speaker labels. Audio never leaves this Mac.</p>
  </div>
  <div class="card hero">
    <button id="rec" class="mic" aria-label="Start recording">
      <svg class="ico-mic" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
      <svg class="ico-stop" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
    </button>
    <div id="timer" class="timer idle">0:00</div>
    <div id="status" class="hint">Press to record from your microphone</div>
    <canvas id="meter" class="meter" width="840" height="88"></canvas>
    <div id="job" class="job">
      <div class="row"><span id="jobstage">Working…</span><span id="jobpct"></span></div>
      <div id="bar" class="progress"><i></i></div>
    </div>
    <div class="actions">
      <button id="tab" class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Capture Meet tab</button>
      <label class="btn filelbl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L8 8m4-4 4 4M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>Upload audio<input id="file" type="file" accept="audio/*,video/webm"></label>
    </div>
    <details class="opts">
      <summary>Language &amp; options</summary>
      <div class="row">
        <label class="field">Language<select id="lang"></select></label>
        <label class="field">Speakers<select id="spk">
          <option value="auto">auto</option><option>2</option><option>3</option>
          <option>4</option><option>5</option><option>6</option>
        </select></label>
        <label class="field">Script<select id="mode" title="Mixed keeps English words in English (code-mix). Needs the flex engine.">
          <option value="mixed">Mixed — Hindi + English words</option><option value="native">Native script only</option><option value="romanized">Romanized (Latin)</option>
        </select></label>
        <label class="field">Engine<select id="engine">
          <option value="int4">int4 — fast, native script only</option>
          <option value="flex">flex — code-mix, best quality</option>
          <option value="torch">core — max accuracy, native script</option>
        </select></label>
      </div>
    </details>
  </div>
  <div id="result" hidden>
    <div class="sectionhead">
      <h2>Transcript</h2>
      <div style="display:flex;gap:8px">
        <button id="copy" class="btn small" disabled>Copy</button>
        <button id="dl" class="btn small" disabled>Download .md</button>
        <a class="btn small primary" id="openrec" href="/app/">Open notes</a>
      </div>
    </div>
    <div id="out" class="card"></div>
  </div>
</main>
</div></div>
<div class="toasts" id="toasts"></div>
<script>
const $ = id => document.getElementById(id);
const COLORS = ["#d2542a","#3a6ea5","#3f8a5a","#8a5a9e","#b58a1f","#3f8a8a","#b04a6e","#5a5a9e"];
let recorder = null, chunks = [], t0 = 0, tick = null, lastTurns = null;

fetch("/api/languages").then(r => r.json()).then(ls => {
  $("lang").innerHTML = `<option value="auto">auto (detect)</option>` +
    ls.map(l => `<option${l === "hi" ? " selected" : ""}>${l}</option>`).join("");
  $("dot").classList.remove("bad");
}).then(() => fetch("/api/health")).then(r => r.json()).then(h => {
  if (h.torch) { $("engine").value = "flex"; }  // dev checkout with torch: code-mix by default
  else for (const o of $("engine").options) if (o.value !== "int4") { o.disabled = true; o.textContent += " (needs torch install)"; }
}).catch(() => { $("dot").classList.add("bad"); setStatus("server unreachable", true); });

function setStatus(msg, isErr) {
  $("status").textContent = msg;
  $("status").className = isErr ? "hint err" : "hint";
}
function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  $("toasts").appendChild(el); setTimeout(() => el.remove(), 2200);
}
function setProgress(f, stage, busy) {
  $("job").classList.add("show");
  $("bar").classList.toggle("busy", !!busy);
  $("bar").firstElementChild.style.width = (f * 100).toFixed(1) + "%";
  if (stage) $("jobstage").textContent = stage;
  $("jobpct").textContent = busy || !f ? "" : (f * 100).toFixed(0) + "%";
}
const STAGES = { queued: "Waiting in queue", loading: "Loading audio", diarizing: "Separating speakers", transcribing: "Transcribing", done: "Done" };

async function toWav16k(blob, lastSeconds) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ac.decodeAudioData(await blob.arrayBuffer());
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  let data = (await off.startRendering()).getChannelData(0);
  ac.close();
  if (lastSeconds) data = data.subarray(Math.max(0, data.length - lastSeconds * 16000));
  const n = data.length, ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); ws(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true);
  v.setUint16(34, 16, true); ws(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, data[i])) * 32767, true);
  return new Blob([ab], { type: "audio/wav" });
}

async function submit(blob) {
  setStatus("Preparing audio…"); setProgress(0, "Converting audio", true);
  let wav;
  try {
    wav = await toWav16k(blob);
  } catch (e) {
    setStatus("could not decode audio: " + e.message, true); return;
  }
  const fd = new FormData();
  fd.append("file", wav, "audio.wav");
  fd.append("lang", $("lang").value);
  fd.append("speakers", $("spk").value);
  fd.append("engine", $("engine").value);
  fd.append("mode", $("engine").value === "int4" ? "native" : $("mode").value);
  setProgress(0, "Uploading", true);
  let r;
  try {
    r = await fetch("/api/jobs", { method: "POST", body: fd });
  } catch (e) {
    setStatus("upload failed: " + e.message, true); return;
  }
  if (!r.ok) { setStatus((await r.json()).detail || "upload failed", true); return; }
  const { job_id } = await r.json();
  poll(job_id);
}

async function poll(id) {
  for (;;) {
    await new Promise(res => setTimeout(res, 1000));
    let j;
    try {
      j = await (await fetch("/api/jobs/" + id)).json();
    } catch (e) {
      setStatus("lost contact with server: " + e.message, true); return;
    }
    if (j.status === "error") { $("job").classList.remove("show"); setStatus("Transcription failed: " + j.error, true); return; }
    const stage = STAGES[j.stage] || j.stage;
    setProgress(j.progress || 0, stage, j.stage === "diarizing" || j.stage === "loading" || j.stage === "queued");
    setStatus(stage + "…");
    if (j.status === "done") {
      setProgress(1, "Done");
      setTimeout(() => $("job").classList.remove("show"), 900);
      render(j.result);
      $("openrec").href = "/app/#/r/" + id;  // job id is the recording id
      setStatus(`Saved to Recordings · ${j.result.length} turn${j.result.length === 1 ? "" : "s"}` +
        (j.detected_lang && j.lang === "auto" ? ` · detected ${j.detected_lang}` : ""));
      toast("Transcript ready — saved to Recordings");
      return;
    }
  }
}

function turnHtml(t, cls) {
  const c = COLORS[t.speaker % COLORS.length];
  return `<div class="turn ${cls || ""}"><div class="avatar" style="background:${c}">${cls === "live" ? "…" : "S" + t.speaker}</div>
    <div><div class="who"><b>${cls === "live" ? "Live preview" : "Speaker " + t.speaker}</b>${cls === "live" ? "" : `<span>${t.start.toFixed(1)}s – ${t.end.toFixed(1)}s</span>`}</div><div class="txt"></div></div></div>`;
}
function render(turns) {
  lastTurns = turns;
  $("result").hidden = false;
  $("out").innerHTML = turns.map(t => turnHtml(t)).join("") ||
    '<div class="empty"><p>No speech detected in this recording.</p></div>';
  [...$("out").querySelectorAll(".txt")].forEach((el, i) => el.textContent = turns[i].text);
  $("dl").disabled = $("copy").disabled = !turns.length;
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}
const plain = () => lastTurns.map(t => `speaker_${String(t.speaker).padStart(2, "0")} [${t.start.toFixed(1)}-${t.end.toFixed(1)}]: ${t.text}`).join("\n");
$("copy").onclick = async () => { await navigator.clipboard.writeText(plain()); toast("Transcript copied"); };

$("dl").onclick = () => {
  const md = lastTurns.map(t => `**speaker_${String(t.speaker).padStart(2, "0")}** [${t.start.toFixed(1)}-${t.end.toFixed(1)}]: ${t.text}`).join("\n\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
  a.download = "notes-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".md";
  a.click(); URL.revokeObjectURL(a.href);
};

$("file").onchange = e => { if (e.target.files[0]) submit(e.target.files[0]); e.target.value = ""; };

// MediaRecorder timeslices after the first have no container header and can't be decoded alone,
// so decode everything so far and keep the newest 10 s.
// ponytail: re-decodes the whole recording every 10 s; switch to AudioWorklet PCM (as the extension does) if long meetings lag.
async function liveChunk(all) {
  try {
    const wav = await toWav16k(all, 10);
    const fd = new FormData();
    fd.append("file", wav, "chunk.wav");
    fd.append("lang", $("lang").value);
    const r = await fetch("/api/quick", { method: "POST", body: fd });
    if (!r.ok) return;
    const { text } = await r.json();
    if (!text || !recorder) return;
    $("result").hidden = false;
    if ($("out").querySelector(".empty")) $("out").innerHTML = "";
    const el = document.createElement("div");
    el.innerHTML = turnHtml({ speaker: 0 }, "live");
    el.firstElementChild.querySelector(".txt").textContent = text;
    $("out").appendChild(el.firstElementChild);
  } catch (e) { /* provisional only; final pass fixes everything */ }
}

let meterCtx = null, meterRaf = 0;
function startMeter(stream) {
  const cv = $("meter"), g = cv.getContext("2d"), bars = new Array(60).fill(0);
  meterCtx = new AudioContext();
  const an = meterCtx.createAnalyser(); an.fftSize = 512;
  meterCtx.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.fftSize);
  const acc = getComputedStyle(document.documentElement).getPropertyValue("--acc").trim() || "#d2542a";
  cv.classList.add("live");
  let n = 0;
  (function draw() {
    meterRaf = requestAnimationFrame(draw);
    if (++n % 3) return;
    an.getByteTimeDomainData(buf);
    let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
    bars.push(Math.min(1, peak / 90)); bars.shift();
    g.clearRect(0, 0, cv.width, cv.height);
    g.fillStyle = acc;
    const w = cv.width / bars.length;
    bars.forEach((b, i) => { const h = Math.max(6, b * cv.height); g.beginPath(); g.roundRect(i * w + 3, (cv.height - h) / 2, w - 6, h, 4); g.fill(); });
  })();
}
function stopMeter() {
  cancelAnimationFrame(meterRaf); $("meter").classList.remove("live");
  if (meterCtx) { meterCtx.close(); meterCtx = null; }
}
function startRecorder(stream, extras = [], ctx = null) {
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.onerror = () => setStatus("recording error: " + (recorder.error || "unknown"), true);
  recorder.ondataavailable = e => {
    chunks.push(e.data);
    if (recorder.state === "recording" && e.data.size) liveChunk(new Blob(chunks, { type: recorder.mimeType }));
  };
  recorder.onstop = () => {
    stream.getTracks().forEach(tr => tr.stop());
    extras.forEach(s => s && s.getTracks().forEach(tr => tr.stop()));
    if (ctx) ctx.close();
    clearInterval(tick); $("timer").textContent = "0:00"; $("timer").classList.add("idle");
    $("rec").classList.remove("on"); $("rec").setAttribute("aria-label", "Start recording");
    stopMeter();
    const blob = new Blob(chunks, { type: recorder.mimeType });
    recorder = null;
    submit(blob);
  };
  recorder.start(10000);  // 10 s timeslices -> provisional live transcription
  t0 = Date.now();
  tick = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $("timer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 500);
  $("rec").classList.add("on"); $("rec").setAttribute("aria-label", "Stop recording");
  $("timer").classList.remove("idle"); $("out").innerHTML = ""; $("result").hidden = true;
  startMeter(stream);
  setStatus("Recording — live preview every 10 s; speaker labels arrive when you stop");
}

$("rec").onclick = async () => {
  if (recorder) { recorder.stop(); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setStatus("microphone unavailable: " + e.name + " — allow mic access for this site in browser settings", true);
    return;
  }
  startRecorder(stream);
};

$("tab").onclick = async () => {
  if (recorder) { recorder.stop(); return; }
  let disp;
  try {
    disp = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  } catch (e) {
    setStatus("tab capture cancelled or unavailable: " + e.name, true); return;
  }
  const audioTracks = disp.getAudioTracks();
  if (!audioTracks.length) {
    disp.getTracks().forEach(t => t.stop());
    setStatus("no tab audio captured: pick the Meet tab in the picker and enable 'Share tab audio'", true);
    return;
  }
  disp.getVideoTracks().forEach(t => t.stop());
  let mic = null;
  try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { /* remote voices only */ }
  const ctx = new AudioContext();
  const dest = ctx.createMediaStreamDestination();
  ctx.createMediaStreamSource(new MediaStream(audioTracks)).connect(dest);
  if (mic) ctx.createMediaStreamSource(mic).connect(dest);
  setStatus("capturing Meet tab audio" + (mic ? " + your mic" : " (mic unavailable: remote voices only)"));
  startRecorder(dest.stream, [disp, mic], ctx);
};
</script>
</body>
</html>
