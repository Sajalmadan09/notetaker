<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notetaker — offline Indic meeting notes</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="topbar">
  <span class="brand"><span class="dot" id="dot"></span>Notetaker</span>
  <nav class="nav">
    <a href="/" aria-current="page">Record</a>
    <a href="/dashboard.html">Recordings</a>
  </nav>
</div>
<main class="container">
  <div class="pagehead">
    <h1>Meeting notes</h1>
    <p>Offline Indic transcription — audio never leaves this machine.</p>
  </div>
  <div class="card">
    <div class="panel">
      <button id="rec" class="btn primary">● Record</button>
      <span id="timer" class="timer">0:00</span>
      <button id="tab" class="btn">Capture Meet tab</button>
      <label class="btn filelbl">Upload audio<input id="file" type="file" accept="audio/*,video/webm"></label>
      <label class="field">Language<select id="lang"></select></label>
      <label class="field">Speakers<select id="spk">
        <option value="auto">auto</option><option>2</option><option>3</option>
        <option>4</option><option>5</option><option>6</option>
      </select></label>
      <label class="field">Engine<select id="engine" title="torch needs the bench extra and is macOS-GPU accelerated">
        <option value="int4">int4 (fast)</option><option value="torch">torch (max accuracy)</option>
      </select></label>
      <button id="dl" class="btn" disabled>Download .md</button>
    </div>
    <div id="status" class="status"></div>
    <div id="bar" class="progress"><i></i></div>
  </div>
  <div id="out" style="margin-top:16px"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const COLORS = ["#b4552d","#3a6ea5","#4a7c59","#8a5a9e","#a58a3a","#5a8a8a","#a55a6e","#6a6a9e"];
let recorder = null, chunks = [], t0 = 0, tick = null, lastTurns = null;

fetch("/api/languages").then(r => r.json()).then(ls => {
  $("lang").innerHTML = `<option value="auto">auto (detect)</option>` +
    ls.map(l => `<option${l === "hi" ? " selected" : ""}>${l}</option>`).join("");
  $("dot").classList.remove("bad");
}).catch(() => { $("dot").classList.add("bad"); setStatus("server unreachable", true); });

function setStatus(msg, isErr) {
  $("status").textContent = msg;
  $("status").className = isErr ? "status err" : "status";
}
function setProgress(f) { $("bar").firstElementChild.style.width = (f * 100).toFixed(1) + "%"; }

async function toWav16k(blob) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ac.decodeAudioData(await blob.arrayBuffer());
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const data = (await off.startRendering()).getChannelData(0);
  ac.close();
  const n = data.length, ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); ws(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true);
  v.setUint16(34, 16, true); ws(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, data[i])) * 32767, true);
  return new Blob([ab], { type: "audio/wav" });
}

async function submit(blob) {
  setStatus("converting to 16 kHz WAV…"); setProgress(0);
  let wav;
  try {
    wav = await toWav16k(blob);
  } catch (e) {
    setStatus("could not decode audio: " + e.message, true); return;
  }
  const fd = new FormData();
  fd.append("file", wav, "audio.wav");
  fd.append("lang", $("lang").value);
  fd.append("speakers", $("spk").value);
  fd.append("engine", $("engine").value);
  setStatus("uploading…");
  let r;
  try {
    r = await fetch("/api/jobs", { method: "POST", body: fd });
  } catch (e) {
    setStatus("upload failed: " + e.message, true); return;
  }
  if (!r.ok) { setStatus((await r.json()).detail || "upload failed", true); return; }
  const { job_id } = await r.json();
  poll(job_id);
}

async function poll(id) {
  for (;;) {
    await new Promise(res => setTimeout(res, 1000));
    let j;
    try {
      j = await (await fetch("/api/jobs/" + id)).json();
    } catch (e) {
      setStatus("lost contact with server: " + e.message, true); return;
    }
    if (j.status === "error") { setStatus(j.error, true); setProgress(0); return; }
    setProgress(j.progress || 0);
    setStatus(j.status === "done" ? `done — ${j.result.length} turns` : `${j.stage}… ${(100 * (j.progress || 0)).toFixed(0)}%`);
    if (j.status === "done") {
      render(j.result);
      if (j.detected_lang && j.lang === "auto")
        setStatus(`done — ${j.result.length} turns (detected language: ${j.detected_lang})`);
      return;
    }
  }
}

function render(turns) {
  lastTurns = turns;
  $("out").innerHTML = turns.map(t => `
    <div class="card turn" style="border-left-color:${COLORS[t.speaker % COLORS.length]}">
      <div class="meta"><span class="chip" style="background:${COLORS[t.speaker % COLORS.length]}">speaker ${t.speaker}</span>
      <span>${t.start.toFixed(1)}s – ${t.end.toFixed(1)}s</span></div>
      <div class="txt"></div>
    </div>`).join("");
  [...$("out").querySelectorAll(".txt")].forEach((el, i) => el.textContent = turns[i].text);
  $("dl").disabled = !turns.length;
}

$("dl").onclick = () => {
  const md = lastTurns.map(t => `**speaker_${String(t.speaker).padStart(2, "0")}** [${t.start.toFixed(1)}-${t.end.toFixed(1)}]: ${t.text}`).join("\n\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
  a.download = "notes-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".md";
  a.click(); URL.revokeObjectURL(a.href);
};

$("file").onchange = e => { if (e.target.files[0]) submit(e.target.files[0]); e.target.value = ""; };

async function liveChunk(blob) {
  try {
    const wav = await toWav16k(blob);
    const fd = new FormData();
    fd.append("file", wav, "chunk.wav");
    fd.append("lang", $("lang").value);
    const r = await fetch("/api/quick", { method: "POST", body: fd });
    if (!r.ok) return;
    const { text } = await r.json();
    if (!text || !recorder) return;
    const el = document.createElement("div");
    el.className = "card turn";
    el.style.borderLeftColor = "#888";
    el.innerHTML = `<div class="meta"><span class="chip" style="background:#888">live</span></div><div class="txt"></div>`;
    el.querySelector(".txt").textContent = text;
    $("out").appendChild(el);
  } catch (e) { /* provisional only; final pass fixes everything */ }
}

function startRecorder(stream, extras = [], ctx = null) {
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.onerror = () => setStatus("recording error: " + (recorder.error || "unknown"), true);
  recorder.ondataavailable = e => {
    chunks.push(e.data);
    if (recorder.state === "recording" && e.data.size) liveChunk(e.data);
  };
  recorder.onstop = () => {
    stream.getTracks().forEach(tr => tr.stop());
    extras.forEach(s => s && s.getTracks().forEach(tr => tr.stop()));
    if (ctx) ctx.close();
    clearInterval(tick); $("timer").textContent = "0:00";
    $("rec").textContent = "● Record"; $("rec").classList.remove("on");
    const blob = new Blob(chunks, { type: recorder.mimeType });
    recorder = null;
    submit(blob);
  };
  recorder.start(10000);  // 10 s timeslices -> provisional live transcription
  t0 = Date.now();
  tick = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $("timer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 500);
  $("rec").textContent = "■ Stop"; $("rec").classList.add("on");
  setStatus("recording… live preview every 10 s; speaker labels arrive at the end");
}

$("rec").onclick = async () => {
  if (recorder) { recorder.stop(); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setStatus("microphone unavailable: " + e.name + " — allow mic access for this site in browser settings", true);
    return;
  }
  startRecorder(stream);
};

$("tab").onclick = async () => {
  if (recorder) { recorder.stop(); return; }
  let disp;
  try {
    disp = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  } catch (e) {
    setStatus("tab capture cancelled or unavailable: " + e.name, true); return;
  }
  const audioTracks = disp.getAudioTracks();
  if (!audioTracks.length) {
    disp.getTracks().forEach(t => t.stop());
    setStatus("no tab audio captured: pick the Meet tab in the picker and enable 'Share tab audio'", true);
    return;
  }
  disp.getVideoTracks().forEach(t => t.stop());
  let mic = null;
  try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { /* remote voices only */ }
  const ctx = new AudioContext();
  const dest = ctx.createMediaStreamDestination();
  ctx.createMediaStreamSource(new MediaStream(audioTracks)).connect(dest);
  if (mic) ctx.createMediaStreamSource(mic).connect(dest);
  setStatus("capturing Meet tab audio" + (mic ? " + your mic" : " (mic unavailable: remote voices only)"));
  startRecorder(dest.stream, [disp, mic], ctx);
};
</script>
</body>
</html>
