<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notetaker — recordings</title>
<link rel="stylesheet" href="/app.css?v=0.1.3">
</head>
<body>
<div class="topbar">
  <span class="brand"><span class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></span>Notetaker<span class="dot" id="dot" title="server status"></span></span>
  <nav class="nav">
    <a href="/">Record</a>
    <a href="/dashboard.html" aria-current="page">Recordings</a>
  </nav>
</div>
<main class="container">
  <div class="pagehead">
    <h1>Recordings</h1>
    <p>Meetings and dictations, stored on this machine only. Play back, read, export.</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <label class="field grow">Search
      <input class="input" id="q" type="search" placeholder="Search transcripts…  ( / )">
    </label>
    <div class="seg" id="seg" role="group" aria-label="Source">
      <button data-v="all" aria-pressed="true">All</button>
      <button data-v="meeting" aria-pressed="false">Meetings</button>
      <button data-v="dictation" aria-pressed="false">Dictations</button>
    </div>
    <button class="btn" id="refresh">Refresh</button>
  </div>
  <div id="list">
    <div class="skeleton skel-card"></div>
    <div class="skeleton skel-card"></div>
  </div>
</main>
<div class="toasts" id="toasts"></div>
<script>
const $ = id => document.getElementById(id);
const COLORS = ["#d2542a","#3a6ea5","#3f8a5a","#8a5a9e","#b58a1f","#3f8a8a","#b04a6e","#5a5a9e"];
let rows = [], full = {}, src = "all";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = (text, q) => { const e = esc(text); return q ? e.replace(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>") : e; };
const fmtDur = s => s >= 60 ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s` : `${Math.round(s)}s`;

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

async function load() {
  $("list").innerHTML = '<div class="skeleton skel-card"></div><div class="skeleton skel-card"></div>';
  try {
    rows = await (await fetch("/api/history")).json();
    $("dot").classList.remove("bad");
  } catch (e) {
    $("dot").classList.add("bad");
    $("list").innerHTML = '<div class="empty"><p>Server unreachable.</p></div>';
    return;
  }
  const mins = rows.reduce((a, r) => a + (r.duration_s || 0), 0) / 60;
  const dict = rows.filter(r => r.source === "dictation").length;
  $("stats").innerHTML = `
    <div class="stat"><b>${rows.length}</b><span>recordings</span></div>
    <div class="stat"><b>${mins.toFixed(1)}</b><span>minutes of audio</span></div>
    <div class="stat"><b>${dict}</b><span>dictations</span></div>`;
  full = {};
  render();
}

function render() {
  const q = $("q").value.trim().toLowerCase();
    const shown = rows.filter(r =>
    (src === "all" || (r.source || "meeting") === src) &&
    (!q || (r.preview || "").toLowerCase().includes(q)));
  if (!shown.length) {
    $("list").innerHTML = `<div class="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 3v10m0 0a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v4a3 3 0 0 0 3 3zm-7-3v1a7 7 0 0 0 14 0v-1M12 17v4m-4 0h8"/>
      </svg>
      <p>${rows.length ? "Nothing matches your filter." : "No recordings yet. Record or dictate — completed sessions appear here with audio and exports."}</p>
    </div>`;
    return;
  }
  $("list").innerHTML = shown.map(r => `
    <details class="card rec" id="rec-${r.id}">
      <summary>
        <div class="meta">
          <b>${esc(r.ts)}</b>
          <span class="badge ${r.source === "dictation" ? "acc" : ""}">${r.source === "dictation" ? "Dictation" : "Meeting"}</span>
          ${r.verdict ? `<span class="badge ${r.verdict === "verified_before_after" ? "ok" : "warn"}">${esc(r.verdict.replace(/_/g, " "))}</span>` : ""}
          <span class="badge">${esc(r.lang)}</span>
          <span>${fmtDur(r.duration_s || 0)} · ${r.turn_count} turn${r.turn_count === 1 ? "" : "s"}</span>
        </div>
        <div class="preview">${r.preview ? hl(r.preview, q) : "<span style='color:var(--mut)'>No speech detected</span>"}</div>
      </summary>
      <div class="body">
        ${r.audio ? `<audio controls preload="none" src="/api/history/${r.id}/audio"></audio>` : ""}
        <div class="turns"></div>
        <div class="exports">
          <a class="btn small" href="/api/history/${r.id}/export?fmt=md" download>Markdown</a>
          <a class="btn small" href="/api/history/${r.id}/export?fmt=txt" download>Text</a>
          <a class="btn small" href="/api/history/${r.id}/export?fmt=pdf" download>PDF</a>
          <button class="btn small ghost" data-copy="${r.id}">Copy transcript</button>
        </div>
      </div>
    </details>`).join("");
  document.querySelectorAll("details.rec").forEach(d =>
    d.addEventListener("toggle", () => { if (d.open && !d.dataset.h) { d.dataset.h = 1; hydrate(d.id.slice(4)); } }));
  if (q && shown.length === 1) document.querySelector("details.rec").open = true;
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const rec = full[b.dataset.copy] || await (await fetch("/api/history/" + b.dataset.copy)).json();
    const text = (rec.turns || []).map(t => `speaker_${String(t.speaker).padStart(2, "0")} [${t.start.toFixed(1)}-${t.end.toFixed(1)}]: ${t.text}`).join("\n");
    await navigator.clipboard.writeText(text);
    toast("Transcript copied");
  });
}

async function hydrate(id) {
  const rec = await (await fetch("/api/history/" + id)).json();
  full[id] = rec;
  const box = document.querySelector(`#rec-${id} .turns`);
  if (!box) return;
  const q = $("q").value.trim();
  box.innerHTML = (rec.turns || []).map(t => {
    const c = COLORS[t.speaker % COLORS.length];
    return `<div class="turn"><div class="avatar" style="background:${c}">S${t.speaker}</div>
      <div><div class="who"><b>Speaker ${t.speaker}</b><span>${t.start.toFixed(1)}s – ${t.end.toFixed(1)}s</span></div>
      <div class="txt">${hl(t.text, q)}</div></div></div>`;
  }).join("") || '<div class="empty"><p>No speech detected in this recording.</p></div>';
}

$("refresh").onclick = load;
$("q").oninput = render;
$("seg").onclick = e => { const b = e.target.closest("button"); if (!b) return; src = b.dataset.v; document.querySelectorAll("#seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); };
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("q").focus(); }
});
load();
</script>
</body>
</html>
