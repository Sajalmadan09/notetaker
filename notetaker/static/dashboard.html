<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notetaker — recordings</title>
<link rel="stylesheet" href="/app.css?v=0.2.0">
</head>
<body class="shell">
<aside class="side">
  <span class="brand"><span class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></span>Notetaker<span class="dot" id="dot" title="server status"></span></span>
  <nav>
    <a href="/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>Record</a>
    <a href="/dashboard.html" aria-current="page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Recordings</a>
  </nav>
  <div class="foot" id="foot">Local · offline</div>
</aside>
<div class="split">
  <section class="listcol">
    <div class="listhead">
      <h1>Recordings</h1>
      <div class="sub" id="sub"></div>
      <input class="input" id="q" type="search" placeholder="Search transcripts…  ( / )" aria-label="Search transcripts">
      <div class="seg" id="seg" role="group" aria-label="Source">
        <button data-v="all" aria-pressed="true">All</button>
        <button data-v="meeting" aria-pressed="false">Meetings</button>
        <button data-v="dictation" aria-pressed="false">Dictations</button>
      </div>
    </div>
    <div class="items" id="items"><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div></div>
  </section>
  <section class="detailcol"><div class="detail" id="detail"></div></section>
</div>
<div class="toasts" id="toasts"></div>
<script>
const $ = id => document.getElementById(id);
const COLORS = ["#d2542a","#3a6ea5","#3f8a5a","#8a5a9e","#b58a1f","#3f8a8a","#b04a6e","#5a5a9e"];
const col = s => COLORS[s % COLORS.length];
let rows = [], full = {}, src = "all", sel = null, tab = "transcript";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = (text, q) => { const e = esc(text); return q ? e.replace(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>") : e; };
const fmtDur = s => s >= 60 ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s` : `${Math.round(s)}s`;
const clock = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const day = ts => { const d = new Date(ts.replace(" ", "T")), t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t - new Date(d).setHours(0,0,0,0)) / 864e5);
  return diff <= 0 ? "Today" : diff === 1 ? "Yesterday" : diff < 7 ? "This week" : "Earlier"; };

function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  $("toasts").appendChild(el); setTimeout(() => el.remove(), 2200);
}

async function load() {
  try { rows = await (await fetch("/api/history")).json(); $("dot").classList.remove("bad"); }
  catch (e) { $("dot").classList.add("bad"); $("items").innerHTML = '<div class="empty"><p>Server unreachable.</p></div>'; return; }
  const mins = rows.reduce((a, r) => a + (r.duration_s || 0), 0) / 60;
  $("sub").textContent = `${rows.length} recording${rows.length === 1 ? "" : "s"} · ${mins.toFixed(1)} min · ${rows.filter(r => r.source === "dictation").length} dictations`;
  if (!sel && rows.length) sel = rows[0].id;
  renderList(); showDetail();
}

function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const shown = rows.filter(r => (src === "all" || (r.source || "meeting") === src) &&
    (!q || (r.preview || "").toLowerCase().includes(q) || (full[r.id]?.turns || []).some(t => t.text.toLowerCase().includes(q))));
  if (!shown.length) {
    $("items").innerHTML = `<div class="empty"><p>${rows.length ? "Nothing matches your filter." : "No recordings yet. Record or dictate — sessions appear here."}</p></div>`;
    return;
  }
  let last = "", html = "";
  for (const r of shown) {
    const g = day(r.ts);
    if (g !== last) { html += `<div class="group">${g}</div>`; last = g; }
    const dict = r.source === "dictation";
    html += `<button class="item" data-id="${r.id}" aria-current="${r.id === sel}">
      <div class="t">${dict ? "Dictation" : "Meeting"} <span>${esc(r.ts.slice(11, 16))} · ${fmtDur(r.duration_s || 0)}</span></div>
      <div class="p">${r.preview ? hl(r.preview, q) : "No speech detected"}</div></button>`;
  }
  $("items").innerHTML = html;
}

async function showDetail() {
  const box = $("detail");
  const r = rows.find(x => x.id === sel);
  if (!r) { box.innerHTML = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v10m0 0a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v4a3 3 0 0 0 3 3zm-7-3v1a7 7 0 0 0 14 0v-1M12 17v4m-4 0h8"/></svg><p>Select a recording to read, play back and export it.</p></div>`; return; }
  box.innerHTML = '<div class="skeleton" style="height:260px"></div>';
  const rec = full[sel] || (full[sel] = await (await fetch("/api/history/" + sel)).json());
  if (sel !== r.id) return;
  const turns = rec.turns || [], dur = rec.duration_s || (turns.at(-1)?.end ?? 0) || 1;
  const spk = [...new Set(turns.map(t => t.speaker))].sort((a, b) => a - b);
  const talk = s => turns.filter(t => t.speaker === s).reduce((a, t) => a + (t.end - t.start), 0);
  const total = spk.reduce((a, s) => a + talk(s), 0) || 1;
  const dict = r.source === "dictation";
  const q = $("q").value.trim();
  const tl = spk.length > 1 || !dict ? `<div class="tlwrap"><div class="tl">${spk.map(s => `
      <div class="tlrow"><span class="nm"><i style="background:${col(s)}"></i>Speaker ${s}</span>
      <div class="track" data-seek>${turns.filter(t => t.speaker === s).map(t => `<i style="left:${100 * t.start / dur}%;width:${Math.max(.6, 100 * (t.end - t.start) / dur)}%;background:${col(s)}"></i>`).join("")}</div>
      <span class="pc">${Math.round(100 * talk(s) / total)}% · ${fmtDur(talk(s))}</span></div>`).join("")}
    </div><div class="phs"><b class="ph" id="ph"></b></div></div>` : "";
  box.innerHTML = `
    <div class="dhead"><div>
      <h2>${dict ? "Dictation" : "Meeting"} · ${esc(rec.ts.slice(11, 16))}</h2>
      <div class="meta"><span>${esc(rec.ts.slice(0, 10))}</span><span class="badge">${esc(rec.lang)}</span>
        ${rec.mode && rec.mode !== "native" ? `<span class="badge acc">${esc(rec.mode)} script</span>` : ""}
        ${rec.verdict ? `<span class="badge ${rec.verdict === "verified_before_after" ? "ok" : "warn"}">${esc(rec.verdict.replace(/_/g, " "))}</span>` : ""}
        <span>${fmtDur(dur)} · ${turns.length} turn${turns.length === 1 ? "" : "s"}</span></div></div>
      <details class="menu"><summary class="btn primary">Export</summary><div class="pop">
        <a href="/api/history/${rec.id}/export?fmt=md" download>Markdown</a>
        <a href="/api/history/${rec.id}/export?fmt=txt" download>Plain text</a>
        <a href="/api/history/${rec.id}/export?fmt=pdf" download>PDF</a>
        <button id="copy">Copy transcript</button></div></details></div>
    ${rec.audio ? `<div class="card player"><audio id="aud" controls preload="metadata" src="/api/history/${rec.id}/audio"></audio>${tl}</div>` : ""}
    <div class="dtabs">
      <button class="tab" data-tab="transcript" aria-selected="${tab === "transcript"}">Transcript</button>
      <button class="tab" data-tab="details" aria-selected="${tab === "details"}">Details</button>
      <input class="input" id="tq" type="search" placeholder="Find in transcript" value="${esc(q)}"></div>
    <div id="pane"></div>`;
  renderPane(rec);
  const aud = $("aud");
  if (aud) {
    const seek = t => { aud.currentTime = t; aud.play(); };
    box.querySelectorAll("[data-seek]").forEach(el => el.onclick = e => { const b = el.getBoundingClientRect(); seek(dur * (e.clientX - b.left) / b.width); });
    aud.ontimeupdate = () => {
      const ph = $("ph"); if (ph) ph.style.left = (100 * aud.currentTime / dur) + "%";
      const i = turns.findIndex(t => aud.currentTime >= t.start && aud.currentTime < t.end + .3);
      document.querySelectorAll(".turn.seek").forEach((el, k) => {
        const on = k === i; if (on && !el.classList.contains("active")) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
        el.classList.toggle("active", on); });
    };
    $("pane").onclick = e => { const t = e.target.closest(".turn.seek"); if (t) seek(turns[+t.dataset.i].start); };
  }
  $("copy").onclick = async () => {
    await navigator.clipboard.writeText(turns.map(t => `speaker_${String(t.speaker).padStart(2, "0")} [${t.start.toFixed(1)}-${t.end.toFixed(1)}]: ${t.text}`).join("\n"));
    toast("Transcript copied"); box.querySelector(".menu").open = false;
  };
  box.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; box.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b)); renderPane(rec); });
  $("tq").oninput = () => { $("q").value = $("tq").value; renderPane(rec); renderList(); };
}

function renderPane(rec) {
  const turns = rec.turns || [], q = $("tq")?.value.trim() || "";
  if (tab === "details") {
    const spk = [...new Set(turns.map(t => t.speaker))].length;
    $("pane").innerHTML = `<dl class="kv">
      <dt>Recorded</dt><dd>${esc(rec.ts)}</dd><dt>Duration</dt><dd>${fmtDur(rec.duration_s || 0)}</dd>
      <dt>Language</dt><dd>${esc(rec.lang)}</dd><dt>Engine</dt><dd>${esc(rec.engine || "int4")}${rec.mode ? " · " + esc(rec.mode) : ""}</dd>
      <dt>Speakers</dt><dd>${spk}</dd><dt>Source</dt><dd>${esc(rec.source || "meeting")}</dd>
      ${rec.insert_path ? `<dt>Inserted via</dt><dd>${esc(rec.insert_path)}</dd>` : ""}${rec.asr_ms ? `<dt>ASR time</dt><dd>${rec.asr_ms} ms</dd>` : ""}
      <dt>ID</dt><dd>${esc(rec.id)}</dd></dl>`;
    return;
  }
  $("pane").innerHTML = turns.map((t, i) => `
    <div class="turn seek" data-i="${i}"><div class="avatar" style="background:${col(t.speaker)}">S${t.speaker}</div>
      <div><div class="who"><b>Speaker ${t.speaker}</b><span>${clock(t.start)}</span></div>
      <div class="txt">${hl(t.text, q)}</div></div></div>`).join("") || '<div class="empty"><p>No speech detected in this recording.</p></div>';
}

$("items").onclick = e => { const b = e.target.closest(".item"); if (!b) return; sel = b.dataset.id; renderList(); showDetail(); };
$("q").oninput = () => { renderList(); if (full[sel] && $("tq")) { $("tq").value = $("q").value; renderPane(full[sel]); } };
$("seg").onclick = e => { const b = e.target.closest("button"); if (!b) return; src = b.dataset.v;
  document.querySelectorAll("#seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderList(); };
document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("q").focus(); } });
fetch("/api/health").then(r => r.json()).then(h => { $("foot").textContent = (h.torch ? "Code-mix ready" : "Fast mode") + " · offline"; }).catch(() => {});
load();
</script>
</body>
</html>
